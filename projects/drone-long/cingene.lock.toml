# Locked edit. Replayed verbatim by `build`, bypassing the scorer, so an
# approved running order survives changes made elsewhere.
#
# Edit by hand: `clip` swaps a shot, `bars` resizes a slot (1 bar = one
# musical bar), `rate` sets a constant speed-up, `reverse` sets the play
# direction for this slot alone.
#
# `reverse` is here because direction is a property of a shot, not of a
# clip. CLIP_REVERSE_OVERRIDE can only flip every use of a clip at once,
# which is right for a clip used once and wrong the moment one slot wants
# to run backwards and another forwards.
# Regenerate from the current edit with `build --lock-out <file>`.

[[lock]]
# The reversed pair, first half. Reveal 1 at 2x fills its three bars with the
# whole 17.35s of the clip; at 1x it would show only the first 8.67s and the
# reveal would never complete. Backwards it climbs coast to forest.
bar = 8
clip = "Forest Coast Reveal 1.mp4"
bars = 3
rate = 2.000
reverse = true

[[lock]]
# Second half of the pair, and the only Forest Coast 2 slot that runs backwards
# — which is exactly what per-slot `reverse` is for. Source 6.0-29.1s at 2x:
# forwards that stretch travels trees to houses to sea, so reversed it runs sea
# to houses to trees and continues the climb inland the reveal started.
bar = 11
clip = "Forest Coast 2.mp4"
bars = 4
rate = 2.000
reverse = true

