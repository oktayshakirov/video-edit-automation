# The closer, set by hand: Forest Coast Reveal 2 running backwards, so the
# reveal closes in on itself as the song ends. The project forces reverse on
# every use of this clip.
#
# It runs at 2x, so the last two bars eat 11.6s of source and the reveal
# whips shut as the song ends. This only became affordable after the bar 80
# swap above: with eight slots on a 28.1s clip there was ~6s left here, the
# build fitted the shortfall into the timeMap and produced a 0.28x segment,
# which the validator rejects and which would have read as slow motion.
[[lock]]
bar = 110
clip = "Forest Coast Reveal 2.mp4"
bars = 2
rate = 2.000
