# Cingene, Bulgaria — a fishing village on the coast south of Burgas.
# 14 graded selects, 393s of footage, 3840x2160. Paths are absolute because
# footage lives outside the repo. Anything under [overrides] must name a real
# constant in video_automation/drone/config.py or the build fails loudly.

name = "Cingene"
profile = "youtube"

footage = "~/Desktop/Cingene"
music = "~/Desktop/Cingene/Pold - SUMMER VIBE.mp3"

# The approved running order, replayed verbatim. With a lock present the scorer
# is bypassed entirely, so nothing under [overrides] can reshuffle the timeline.
# Swap or resize a shot by editing the lock file, not by retuning weights.
lock = "cingene.lock.toml"

[overrides]
# --- music loop ----------------------------------------------------------
# The track is 232.1s / 80 bars at 82.99 BPM (bar = 2.892s) and the footage is
# 393s, so it is looped once to give the library room.
#
# Pass 1 hands off at bar 40, the downbeat of the closing peak (energy 0.93),
# and pass 2 re-enters at bar 20, a phrase line inside the opening peak (0.86).
# 100 bars, 4:49.
#
# Returning at bar 24 instead ran 96 bars and was 12s shorter, but bar 24 opens
# the 0.69 peak: the seam stepped 0.93 -> 0.69 and the join was audible as a
# drop in the music. 0.93 -> 0.86 is the same energy match the earlier 108-bar
# version had, which is the one that sounded right. Twelve seconds is the price
# of the better seam.
MUSIC_LOOP = true
MUSIC_LOOP_HANDOFF_BAR = 40
MUSIC_LOOP_RETURN_BAR = 20
MUSIC_LOOP_CROSSFADE_BARS = 2      # 5.8s crossfade

# --- the four reveals, shown whole -----------------------------------------
# Forest Coast Reveal 1 and 2, Sunset Sea 7 and Sunset Sea Boats 2 are all one
# continuous vertical gesture — an overhead frame travelling down into the
# sunset. Split across slots the gesture is gone and the halves read as two
# ordinary shots, so each is capped at a single use and pinned to a slot sized
# to the clip rather than to the bar grid.
#
# Forest Coast 1 is capped for a different reason: it is the only clip shot
# before golden hour and it does not match. Hue 111.5 degrees against a 341-46
# degree warm cluster, saturation 0.185 against a 0.353 median, 6.9% blown
# highlights — the widest outlier in the batch on all three. Unscored it took
# seven slots, more than any other clip, so the one shot needing hand grading
# was also the one on screen most. Four is enough to keep the forest in the
# film without the mismatch becoming its texture. See cingene-colour.md.
CLIP_MAX_USES = { "Forest Coast Reveal 1" = 1, "Forest Coast Reveal 2" = 1, "Sunset Sea 7" = 1, "Sunset Sea Boats 2" = 1, "Forest Coast 1" = 4 }

# Pins override scoring, the cooldown and the use cap, and they reserve the
# clip against earlier slots. Lengths here are literal — six bars is not a
# length the scorer may choose, but it is the one that fits a 17.7s reveal.
#   0  -> Sunset Sea 7 opens, whole, at real time: 17.35s of a 17.7s clip over
#         six bars. It is the slowest, widest descent in the batch and it sets
#         the film up before anything cuts.
#   6  -> Sunset Sea 1, the favourite, holding the last two bars of the calm
#         intro. A slot cannot cross a section line, so two bars is all there
#         is before the drop at bar 8; it comes back for longer later.
#   12 -> Sunset Sea 2, four shots clear of Sunset Sea 1 and inside the first
#         minute, so the two sunsets read as a transition, not a pair.
#   36 -> Forest Coast Reveal 1, whole, as the escalate below.
#   56 -> Sunset Sea Boats 2 whole, 4 bars = 11.57s of a 13.5s clip.
#   88 -> no clip, length only: puts a slot boundary at bar 92 for the closer.
#   92 -> Forest Coast Reveal 2, reversed at 2x: 23.14s of a 28.1s clip over
#         the last four bars. Backwards it travels sunset to forest and ends on
#         the forest, closing the film where Forest Coast Reveal 1 left it.
PIN_CLIPS = { 0 = "Sunset Sea 7", 6 = "Sunset Sea 1", 12 = "Sunset Sea 2", 36 = "Forest Coast Reveal 1", 56 = "Sunset Sea Boats 2", 92 = "Forest Coast Reveal 2" }
PIN_SLOT_BARS = { 0 = 6, 6 = 2, 12 = 2, 36 = 4, 56 = 4, 88 = 4, 92 = 4 }

# Forest Coast Reveal 1 plays forward at real time and then launches out of the
# shot — the 2x version of it read as a mistake. Body at 100% for the first
# ~9s, then a 2.6s ramp accelerating to 5.5x, which passes through 2x and 3x on
# the way and hands off into the cut. `fit_escalate` will pull the peak down if
# the clip cannot fund the full curve, and reports what it achieved.
ESCALATE_AT_BARS = [36]
ESCALATE_BODY_SPEED = 1.0
ESCALATE_TAIL_SECONDS = 2.6
ESCALATE_TAIL_SPEED = 5.5

# The closer has to run backwards, and it is the only use of the clip now.
CLIP_REVERSE_OVERRIDE = { "Forest Coast Reveal 2" = true }

# --- the slow hovers -------------------------------------------------------
# Sunset Sea 3, 4, 5 and 6 are static holds on open water. Nothing enters or
# leaves frame, so a second of them is much like any other second and they were
# the clips reading as "this again". Two changes: their heads and tails are
# trimmed, which both drops the least interesting seconds and forces the scorer
# to spend them on fewer slots, and 2x is opened up so a long hold can be shown
# as movement rather than as a pause. The clips with something in them — houses,
# boats, trees, the reveals — are left alone.
CLIP_HEAD_SKIP = { "Sunset Sea 3" = 1.0, "Sunset Sea 4" = 1.5, "Sunset Sea 5" = 2.0, "Sunset Sea 6" = 1.5 }
CLIP_SKIP_RANGES = { "Sunset Sea 3" = [[9.8, 10.8]], "Sunset Sea 4" = [[12.7, 14.2]], "Sunset Sea 5" = [[36.6, 38.6]], "Sunset Sea 6" = [[24.9, 26.4]] }

# --- repetition ------------------------------------------------------------
# Eight slots on one clip is what "it keeps showing the same thing" looks like,
# whatever the source cursor says. Six is the ceiling now.
MAX_USES_DEFAULT = 7

# The 0.3s settle-in trim plus the 0.1s tail margin costs 0.4s of every clip,
# and three of the four reveals need essentially their whole length: Sunset Sea
# 7 is 17.7s against a 17.35s slot, and Forest Coast Reveal 1 at 2x wants
# 17.35s of a 17.5s clip. Both fail by fractions of a second with the trim on.
# These are graded selects that already start where they are meant to, so the
# settle-in has nothing to protect here. The tail margin stays.
HEAD_TRIM = 0.0

# --- footage budget ------------------------------------------------------
# 386s of source (after the hover trims) under a 278s timeline. Lower than the
# 25s this project ran before: at 25s only the three longest takes could ever
# reach 2x, which excluded exactly the slow hovers 2x is wanted for.
SPEEDUP_MIN_REMAINING = 15.0

# Wider spacing on repeats now that the timeline is longer.
REUSE_COOLDOWN_SLOTS = 4
REUSE_RECENCY_WINDOW = 12
