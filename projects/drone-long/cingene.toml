# Cingene, Bulgaria — a fishing village on the coast south of Burgas.
# 14 graded selects, 393s of footage, 3840x2160. Paths are absolute because
# footage lives outside the repo. Anything under [overrides] must name a real
# constant in video_automation/drone/config.py or the build fails loudly.

name = "Cingene"
profile = "youtube"

footage = "~/Movies/Cingene"
music = "~/Movies/Cingene/Pold - SUMMER VIBE.mp3"

# The approved running order, replayed verbatim. With a lock present the scorer
# is bypassed entirely, so nothing under [overrides] can reshuffle the timeline.
# Swap or resize a shot by editing the lock file, not by retuning weights.
lock = "cingene.lock.toml"

[overrides]
# --- music loop ----------------------------------------------------------
# The track is 232.1s / 80 bars at 82.99 BPM (bar = 2.892s) and the footage is
# 393s, so it is looped once to give the library room.
#
# Pass 1 hands off at bar 52 and pass 2 re-enters at bar 40 — both inside the
# closing peak, both at energy 0.93, which is the only exact energy match
# available at this length. Bar 40 is also a section line. 92 bars, 4:26.
#
# Pass 1 therefore delivers the whole arc first (calm, peak, peak, build, into
# the big peak), then steps back twelve bars inside that peak and plays out
# through the build and the two calm sections to the song's own ending.
#
# Handing off at 40 and returning at 24 — what this ran before — is a 0.93 to
# 0.69 step, and it was audible as the music dropping at the join. Returning at
# 20 fixes that but costs 8 bars, which is the wrong direction here.
MUSIC_LOOP = true
MUSIC_LOOP_HANDOFF_BAR = 52
MUSIC_LOOP_RETURN_BAR = 40
MUSIC_LOOP_CROSSFADE_BARS = 2      # 5.8s crossfade

# --- the hand-cut opening --------------------------------------------------
# Captured from a Final Cut export (Cingene.fcpxmld/Info.fcpxml) and replayed
# verbatim. Three spine clips, two shots: Sunset Sea 7 for 12.433s, then Sunset
# Sea 1 held for 8.667s and continued for another 2.1s on a smoothed 4x whip
# that lands on the drop at 23.200s.
#
# The third entry carries `start` AND a timemap, which is Final Cut's own way of
# writing a trimmed retime: the curve describes the whole 4x pass over the clip,
# and `start` is the in-point into that retimed result. It is 2.167s in, which
# is why the whip continues through the shot instead of replaying it.
#
# interp is copied as captured. "smooth2" is FCP's easing and this code cannot
# reconstruct it from a speed number, so it is passed through rather than
# approximated.
HEAD_CLIPS = [
  { clip = "Sunset Sea 7", offset = 0.0, start = 0.0, duration = 12.433333 },
  { clip = "Sunset Sea 1", offset = 12.433333, start = 0.0, duration = 8.666667, charge = 5.8 },
  { clip = "Sunset Sea 1", offset = 21.1, start = 2.166667, duration = 2.1, timemap = [[0.0, 0.0, "smooth2"], [7.266667, 29.066667, "smooth2"]], charge = 5.8 },
]
HEAD_UNTIL_BAR = 8

# `charge` pins Sunset Sea 1's cursor at 5.8s after the head — where the two
# bars it replaced would have left it. The head genuinely plays 17.1s of the
# clip and whips back over seconds it already showed, which is the point of the
# transition; charging that honestly would push its three later slots forward
# and re-cut the approved timeline underneath a change that was only ever meant
# to affect the opening.

# The grid was four frames late. Bar 8 computed to 23.318s; the drop is at
# 23.200s, where the opening above was cut by ear. Downbeat confidence on this
# track is 0.39, the lowest in this repo, and this is exactly the failure it
# warns about: a grid that scores well and feels late. Every cut moves earlier
# by the same amount, which is also what joins the hand-cut head to the
# generated spine with no gap.
GRID_PHASE_NUDGE = -0.133333

# --- the four reveals, shown whole -----------------------------------------
# Forest Coast Reveal 1 and 2, Sunset Sea 7 and Sunset Sea Boats 2 are all one
# continuous vertical gesture — an overhead frame travelling down into the
# sunset. Split across slots the gesture is gone and the halves read as two
# ordinary shots, so each is capped at a single use and pinned to a slot sized
# to the clip rather than to the bar grid.
#
# Forest Coast 1 is capped at zero — out of the film entirely. It is the only
# clip that cannot be graded into the batch: measured in CIELAB it is a* -2.0,
# the only clip on the green side of neutral, at hue 126 degrees against a 52
# degree cluster, with L50 72.2 against a median of 39.6 and highlights clipped
# at L99 100.0. The blown top end is gone and does not come back, so the shot
# would stay wrong however far the rest is dialled in. See cingene-colour.md.
#
# It cost the library 39.7s and there is no slack left: capping Forest Coast 2
# to 5 as well leaves the edit 29s short, and dropping MAX_USES_DEFAULT to 6
# leaves it 35s short. Three clips now run at the 7-slot ceiling. That is the
# price of removing a clip this size and it is paid knowingly.
CLIP_MAX_USES = { "Forest Coast Reveal 1" = 1, "Forest Coast Reveal 2" = 1, "Sunset Sea 7" = 1, "Sunset Sea Boats 2" = 1, "Forest Coast 1" = 0 }

# Pins override scoring, the cooldown and the use cap, and they reserve the
# clip against earlier slots. Lengths here are literal — six bars is not a
# length the scorer may choose, but it is the one that fits a 17.5s reveal at
# real time. Bars 0-8 are the hand-cut head, so the scorer starts at bar 8.
#   8  -> Sunset Sea Boats 2, whole, 4 bars = 11.57s of a 13.5s clip. It takes
#         the slot Forest Coast 2 held, which puts a good shot inside the first
#         minute and removes one appearance of a clip that needs grading.
#   12 -> Sunset Sea 2, still inside the first minute, so the two sunsets read
#         as a transition rather than a pair.
#   32 -> Forest Coast Reveal 1, whole, 6 bars = 17.35s at 100%. No ramp: the
#         launch read as an effect on a shot that did not want one. Bar 32 opens
#         the build, which is where a long unhurried descent belongs.
#   88 -> Forest Coast Reveal 2, reversed, the last four bars.
PIN_CLIPS = { 8 = "Sunset Sea Boats 2", 12 = "Sunset Sea 2", 14 = "Sunset Sea Houses", 20 = "Sunset Sea Boats 1", 32 = "Forest Coast Reveal 1", 88 = "Forest Coast Reveal 2" }
PIN_SLOT_BARS = { 8 = 4, 12 = 2, 14 = 1, 20 = 2, 32 = 6, 88 = 4 }

# Nothing escalates. Forest Coast Reveal 1 carried the only ramp and now plays
# straight through at 100%.
ESCALATE_AT_BARS = []

# The closer has to run backwards, and it is the only use of the clip now.
CLIP_REVERSE_OVERRIDE = { "Forest Coast Reveal 2" = true }

# --- the slow hovers -------------------------------------------------------
# Sunset Sea 3, 4, 5 and 6 are static holds on open water. Nothing enters or
# leaves frame, so a second of them is much like any other second and they were
# the clips reading as "this again". Two changes: their heads and tails are
# trimmed, which both drops the least interesting seconds and forces the scorer
# to spend them on fewer slots, and 2x is opened up so a long hold can be shown
# as movement rather than as a pause. The clips with something in them — houses,
# boats, trees, the reveals — are left alone.
CLIP_HEAD_SKIP = { "Sunset Sea 3" = 1.0, "Sunset Sea 4" = 1.5, "Sunset Sea 5" = 2.0, "Sunset Sea 6" = 1.5 }
CLIP_SKIP_RANGES = { "Sunset Sea 3" = [[9.8, 10.8]], "Sunset Sea 4" = [[12.7, 14.2]], "Sunset Sea 5" = [[36.6, 38.6]], "Sunset Sea 6" = [[24.9, 26.4]] }

# --- repetition ------------------------------------------------------------
# Eight slots on one clip is what "it keeps showing the same thing" looks like,
# whatever the source cursor says. Six is the ceiling now.
MAX_USES_DEFAULT = 7

# The 0.3s settle-in trim plus the 0.1s tail margin costs 0.4s of every clip,
# and three of the four reveals need essentially their whole length: Sunset Sea
# 7 is 17.7s against a 17.35s slot, and Forest Coast Reveal 1 at 2x wants
# 17.35s of a 17.5s clip. Both fail by fractions of a second with the trim on.
# These are graded selects that already start where they are meant to, so the
# settle-in has nothing to protect here. The tail margin stays.
HEAD_TRIM = 0.0

# --- footage budget ------------------------------------------------------
# 386s of source (after the hover trims) under a 278s timeline. Lower than the
# 25s this project ran before: at 25s only the three longest takes could ever
# reach 2x, which excluded exactly the slow hovers 2x is wanted for.
SPEEDUP_MIN_REMAINING = 30.0

# Wider spacing on repeats now that the timeline is longer.
REUSE_COOLDOWN_SLOTS = 4
REUSE_RECENCY_WINDOW = 12
