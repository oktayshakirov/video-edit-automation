# Plovdiv, Bulgaria — first batch. 15 graded selects, 3840x2160p30.
#
# Paths are absolute because footage lives outside the repo (it is hundreds of
# gigabytes and has no business in git). Anything under [overrides] must name a
# real constant in video_automation/drone/config.py or the build fails loudly.

name = "Plovdiv"
profile = "youtube"

footage = "~/Desktop/Plovdiv"
music = "~/Desktop/Plovdiv/background music.mp3"

# The approved running order, replayed verbatim. With a lock present the scorer
# is bypassed entirely, so nothing changed here can reshuffle the timeline.
# Swap a shot by editing the lock file, not by retuning weights.
# The clip pins that produced this order are baked into the lock.
lock = "plovdiv.lock.toml"

[overrides]
# Hill Tower is the only orbit in this batch, so the same-move penalty can never
# push against it. Capped by hand instead.
MAX_USES_BY_MOVE = { orbit = 3 }

# Escalates, by slot start bar.
#   4  -> the shot ending at 0:20
#   20 -> City 11 launching into the cut at 1:00
ESCALATE_AT_BARS = [4, 20]

# Hill Tower's opening segment is overexposed. Skipping it shifts its remaining
# uses one segment along: the slot that showed segment 1 now shows segment 2,
# and the slot that showed segment 2 shows segment 3.
CLIP_HEAD_SKIP = { "Hill Tower" = 10.1 }

# Section boundaries snap to phrase lines — this is what put the cuts at 2:11
# and 2:21 on the beat. The lock preserves the resulting grid.
SNAP_SECTIONS_TO_PHRASE = true
